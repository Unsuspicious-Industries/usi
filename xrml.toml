host = "127.0.0.1"
port = 8080
templates_path = "templates"
static_path = "static"
site_name = "Unsuspicious Industries"
site_description = "An open multidisciplinary research collective"
favicon = "/static/favicon.ico"

# Pages with no <?load?> of their own are wrapped in this layout. Every
# <?component?> under components/ is auto-registered, so a page is just its
# <?block?> fills — no import list to maintain.
[templates]
layout = "layouts/base.hrml"

[globals]
primary = "USI_INK"
secondary = "USI_INK"
accent = "USI_ACCENT"
text_heading = "USI_INK"
text_default = "USI_INK"
text_muted = "USI_INK_DIM"
border = "USI_RULE"
bg_page = "USI_GROUND"
bg_section = "USI_SURFACE"
brand_accent_1 = "USI_ACCENT"
brand_accent_2 = "USI_ACCENT"
font_mono = "'Hack', 'Fira Mono', 'Liberation Mono', monospace"
font_serif = "'Libre Baskerville', 'Crimson Text', 'Georgia', serif"
font_typewriter = "'Nazi Typewriter', 'Special Elite', 'Courier Prime', monospace"
